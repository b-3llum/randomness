<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Bellum Security</title>
  <meta name="description" content="Sign in to your Bellum Security account." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background wallpaper. Drop your own image at assets/background.jpg -->
  <div class="backdrop" aria-hidden="true"></div>

  <main class="portal">
    <form id="signin-form" class="card" novalidate autocomplete="on">
      <!-- Brand -->
      <div class="brand">
        <img src="assets/logo.svg" alt="Bellum Security" class="brand__logo" />
      </div>

      <!-- STEP 1: Identifier (email / username) -->
      <section class="step" id="step-identifier" data-active="true">
        <h1 class="heading">Sign in</h1>

        <label for="identifier" class="sr-only">Email, phone, or username</label>
        <input
          type="email"
          id="identifier"
          name="username"
          class="field"
          placeholder="someone@example.com"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <p class="error" id="identifier-error" role="alert" hidden></p>

        <p class="link-row">
          <a href="#" class="link" id="cant-access">Can't access your account?</a>
        </p>

        <div class="actions">
          <button type="button" class="btn btn--ghost" id="back-identifier" hidden>Back</button>
          <button type="submit" class="btn btn--primary" id="next-btn">Next</button>
        </div>
      </section>

      <!-- STEP 2: Password -->
      <section class="step" id="step-password" data-active="false" hidden>
        <button type="button" class="account-pill" id="account-pill">
          <span class="account-pill__arrow" aria-hidden="true">&#8592;</span>
          <span class="account-pill__name" id="account-name"></span>
        </button>

        <h1 class="heading">Enter password</h1>

        <label for="password" class="sr-only">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="field"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <p class="error" id="password-error" role="alert" hidden></p>

        <p class="link-row">
          <a href="#" class="link" id="forgot-password">Forgot my password</a>
        </p>

        <div class="actions">
          <button type="submit" class="btn btn--primary" id="signin-btn">Sign in</button>
        </div>
      </section>

      <!-- Keep me signed in (shown on password step) -->
      <label class="remember" id="remember-row" hidden>
        <input type="checkbox" id="remember" name="remember" />
        <span>Keep me signed in</span>
      </label>
    </form>

    <!-- Sign-in options (mirrors the familiar MS layout, fully generic) -->
    <button type="button" class="options" id="signin-options">
      <span class="options__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="10" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </span>
      <span>Sign-in options</span>
    </button>
  </main>

  <footer class="footer">
    <a href="#" class="footer__link">Terms of use</a>
    <a href="#" class="footer__link">Privacy &amp; cookies</a>
    <span class="footer__spacer"></span>
    <span class="footer__copy">&copy; Bellum Security</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
